[project]
name = "apuf-as-sensor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Vinagrero", email = "servinagrero@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "polars>=2.1.0",
    "pypuf>=2.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.12",
]

[project.scripts]
apuf-as-sensor = "apuf_as_sensor:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "zensical>=0.0.70",
]
